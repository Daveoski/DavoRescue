[project]
name = "davorescue-api"
version = "1.0.0"
description = "DavoRescue emergency reporting, verification and dispatch API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic[email]>=2.9",
  "asyncpg>=0.30",
  "anthropic>=1.0",
  "httpx>=0.28",
  "pyjwt>=2.9",
  "bcrypt>=4.2",
  "pywebpush>=2.0",
  "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
  "uvicorn[standard]>=0.32",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
